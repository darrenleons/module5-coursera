<div class="col-md-12 menu-item-tile">
  <div class="row">
    <div class="col-sm-8">
      <h4>{{name}} <small>[{{short_name}}]</small></h4>
      <p>{{description}}</p>
    </div>
    <div class="col-sm-4">
      <p>
        <span class="item-price">{{price_small}}</span>
        <span class="item-portion">{{small_portion_name}}</span>
      </p>
      <p>
        <span class="item-price">{{price_large}}</span>
        <span class="item-portion">{{large_portion_name}}</span>
      </p>
    </div>
  </div>
</div>
